name: GRIDSHARD Real Mobile Device Gate

on:
  workflow_dispatch:

jobs:
  real-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [android-chrome, iphone-safari]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gridshard
          POSTGRES_USER: gridshard
          POSTGRES_PASSWORD: gridshard-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridshard -d gridshard"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://gridshard:gridshard-ci@127.0.0.1:5432/gridshard
      REDIS_URL: redis://127.0.0.1:6379/0
      GRIDSHARD_RUNTIME_MODE: production
      GRIDSHARD_AUTH_SIGNING_KEY: ci-signing-key-not-for-production
      REAL_DEVICE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: pip install -r server/requirements.txt
      - name: BrowserStack kimliklerini hazırla
        uses: browserstack/github-actions/setup-env@master
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          project-name: GRIDSHARD
          build-name: GRIDSHARD-${{ github.sha }}
      - name: BrowserStack Local tünelini aç
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: start
          local-identifier: random
      - name: GRIDSHARD sunucusunu başlat
        working-directory: server
        run: python -m uvicorn app.main:app --host 0.0.0.0 --port 8879 &
      - name: Sağlık kontrolünü bekle
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8879/health && exit 0
            sleep 1
          done
          exit 1
      - name: Gerçek cihaz E2E
        run: pnpm test:e2e:real-device
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: real-device-${{ matrix.target }}
          path: qa_reports/device_evidence/${{ matrix.target }}.json
          retention-days: 90
      - name: BrowserStack Local tünelini kapat
        if: ${{ always() }}
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: stop
