name: GRIDSHARD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gridshard
          POSTGRES_USER: gridshard
          POSTGRES_PASSWORD: gridshard-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridshard -d gridshard"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://gridshard:gridshard-ci@127.0.0.1:5432/gridshard
      REDIS_URL: redis://127.0.0.1:6379/0
      GRIDSHARD_RUNTIME_MODE: production
      GRIDSHARD_AUTH_SIGNING_KEY: ci-signing-key-not-for-production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r server/requirements.txt
      - run: pytest -q
        working-directory: server

  client-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:client
      - run: pnpm build:mobile:web
        env:
          GRIDSHARD_API_BASE_URL: https://api.invalid.gridshard.example

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, android-chrome-emulated, iphone-safari-emulated]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gridshard
          POSTGRES_USER: gridshard
          POSTGRES_PASSWORD: gridshard-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridshard -d gridshard"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgresql://gridshard:gridshard-ci@127.0.0.1:5432/gridshard
      REDIS_URL: redis://127.0.0.1:6379/0
      GRIDSHARD_RUNTIME_MODE: production
      GRIDSHARD_AUTH_SIGNING_KEY: ci-signing-key-not-for-production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: pip install -r server/requirements.txt
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            qa_reports/playwright-results.json
          retention-days: 30
