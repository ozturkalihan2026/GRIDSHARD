services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gridshard
      POSTGRES_USER: gridshard
      POSTGRES_PASSWORD: ${GRIDSHARD_POSTGRES_PASSWORD:-gridshard-local-only}
    volumes:
      - gridshard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridshard -d gridshard"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - gridshard-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  relay-web:
    build: .
    ports:
      - "8000:8000"
    environment:
      RELAY_WEB_TEST_RUN_ID: web-test-beta.6-docker
      RELAY_TELEMETRY_MAX_EVENTS: "50000"
      GRIDSHARD_RUNTIME_MODE: ${GRIDSHARD_RUNTIME_MODE:-development}
      GRIDSHARD_AUTH_SIGNING_KEY: ${GRIDSHARD_AUTH_SIGNING_KEY:-}
      GRIDSHARD_INSTANCE_ID: ${GRIDSHARD_INSTANCE_ID:-}
      GRIDSHARD_PUBLIC_WS_BASE_URL: ${GRIDSHARD_PUBLIC_WS_BASE_URL:-}
      GRIDSHARD_PUBLIC_WEB_URL: ${GRIDSHARD_PUBLIC_WEB_URL:-http://127.0.0.1:8000}
      GRIDSHARD_EMAIL_PROVIDER: ${GRIDSHARD_EMAIL_PROVIDER:-}
      GRIDSHARD_SMTP_HOST: ${GRIDSHARD_SMTP_HOST:-}
      GRIDSHARD_SMTP_PORT: ${GRIDSHARD_SMTP_PORT:-587}
      GRIDSHARD_SMTP_USERNAME: ${GRIDSHARD_SMTP_USERNAME:-}
      GRIDSHARD_SMTP_PASSWORD: ${GRIDSHARD_SMTP_PASSWORD:-}
      GRIDSHARD_SMTP_FROM: ${GRIDSHARD_SMTP_FROM:-}
      GRIDSHARD_SMTP_STARTTLS: ${GRIDSHARD_SMTP_STARTTLS:-1}
      GRIDSHARD_GOOGLE_OAUTH_CLIENT_ID: ${GRIDSHARD_GOOGLE_OAUTH_CLIENT_ID:-}
      GRIDSHARD_GOOGLE_OAUTH_CLIENT_SECRET: ${GRIDSHARD_GOOGLE_OAUTH_CLIENT_SECRET:-}
      GRIDSHARD_GOOGLE_OAUTH_AUTHORIZE_URL: ${GRIDSHARD_GOOGLE_OAUTH_AUTHORIZE_URL:-https://accounts.google.com/o/oauth2/v2/auth}
      GRIDSHARD_GOOGLE_OAUTH_TOKEN_URL: ${GRIDSHARD_GOOGLE_OAUTH_TOKEN_URL:-https://oauth2.googleapis.com/token}
      GRIDSHARD_GOOGLE_OAUTH_USERINFO_URL: ${GRIDSHARD_GOOGLE_OAUTH_USERINFO_URL:-https://openidconnect.googleapis.com/v1/userinfo}
      GRIDSHARD_GOOGLE_OAUTH_REDIRECT_URI: ${GRIDSHARD_GOOGLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8000/oauth/google/callback}
      GRIDSHARD_APPLE_OAUTH_CLIENT_ID: ${GRIDSHARD_APPLE_OAUTH_CLIENT_ID:-}
      GRIDSHARD_APPLE_OAUTH_CLIENT_SECRET: ${GRIDSHARD_APPLE_OAUTH_CLIENT_SECRET:-}
      GRIDSHARD_APPLE_OAUTH_TEAM_ID: ${GRIDSHARD_APPLE_OAUTH_TEAM_ID:-}
      GRIDSHARD_APPLE_OAUTH_KEY_ID: ${GRIDSHARD_APPLE_OAUTH_KEY_ID:-}
      GRIDSHARD_APPLE_OAUTH_PRIVATE_KEY: ${GRIDSHARD_APPLE_OAUTH_PRIVATE_KEY:-}
      GRIDSHARD_APPLE_OAUTH_PRIVATE_KEY_FILE: ${GRIDSHARD_APPLE_OAUTH_PRIVATE_KEY_FILE:-}
      GRIDSHARD_APPLE_OAUTH_AUTHORIZE_URL: ${GRIDSHARD_APPLE_OAUTH_AUTHORIZE_URL:-https://appleid.apple.com/auth/authorize}
      GRIDSHARD_APPLE_OAUTH_TOKEN_URL: ${GRIDSHARD_APPLE_OAUTH_TOKEN_URL:-https://appleid.apple.com/auth/token}
      GRIDSHARD_APPLE_OAUTH_JWKS_URL: ${GRIDSHARD_APPLE_OAUTH_JWKS_URL:-https://appleid.apple.com/auth/keys}
      GRIDSHARD_APPLE_OAUTH_ISSUER: ${GRIDSHARD_APPLE_OAUTH_ISSUER:-https://appleid.apple.com}
      GRIDSHARD_APPLE_OAUTH_REDIRECT_URI: ${GRIDSHARD_APPLE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8000/oauth/apple/callback}
      GRIDSHARD_PUSH_ENABLED: ${GRIDSHARD_PUSH_ENABLED:-0}
      GRIDSHARD_FCM_SERVICE_ACCOUNT_FILE: ${GRIDSHARD_FCM_SERVICE_ACCOUNT_FILE:-}
      GRIDSHARD_APNS_PRIVATE_KEY_FILE: ${GRIDSHARD_APNS_PRIVATE_KEY_FILE:-}
      GRIDSHARD_APNS_TEAM_ID: ${GRIDSHARD_APNS_TEAM_ID:-}
      GRIDSHARD_APNS_KEY_ID: ${GRIDSHARD_APNS_KEY_ID:-}
      GRIDSHARD_APNS_TOPIC: ${GRIDSHARD_APNS_TOPIC:-}
      GRIDSHARD_APNS_ENVIRONMENT: ${GRIDSHARD_APNS_ENVIRONMENT:-}
      DATABASE_URL: postgresql://gridshard:${GRIDSHARD_POSTGRES_PASSWORD:-gridshard-local-only}@postgres:5432/gridshard
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gridshard-postgres:
  gridshard-redis:
